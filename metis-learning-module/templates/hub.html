<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   The learning system first built for POM 101, and not tied to it: this
   engine renders whatever is in window.COURSE. AI 101, security awareness,
   onboarding, a client's own methodology. Only the content file changes.

   Flat surfaces, hairlines, one type ramp.
   Headings are weight 400 with negative tracking: that is the characteristic
   of this system and the first thing that goes wrong when it is rebuilt from
   memory. Emphasis inside a heading is one <b>, which renders at 600.
   =========================================================================== */
:root{
  --deep:#0F3133; --deep-2:#0B2628;
  --ink:#111; --gray:#4D5A5C; --line:#E2E5E5;
  --bg:#F7F7F6; --card:#fff; --tint:#F2F0F1;
  --teal:#36C6C6; --teal-ink:#127373; --teal-soft:rgba(54,198,198,.14);
  --mint:#B2FFF6; --or:#FB8328; --coral:#F85E48;
  --on-deep:#E6EFEF; --on-deep-dim:#9FB9BA; --line-deep:rgba(255,255,255,.16);
  --r:4px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --font:"Avenir Next LT Pro","Avenir Next","Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --wrap:1080px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:16px;line-height:1.55;color:var(--ink);
  background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
a{color:var(--teal-ink)}
.num,.k{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--teal-ink);outline-offset:2px}

/* ---- masthead: thin, persistent, carries progress ---- */
.mast{position:sticky;top:0;z-index:80;background:rgba(15,49,51,.97);
  backdrop-filter:saturate(1.3) blur(8px);color:var(--on-deep)}
.mast-in{max-width:var(--wrap);margin:0 auto;padding:0 24px;height:54px;
  display:flex;align-items:center;gap:16px}
.mast-id{display:flex;align-items:baseline;gap:10px;min-width:0}
.mast-t{font-size:14px;font-weight:600;white-space:nowrap}
.mast-s{font-size:12.5px;color:var(--on-deep-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-nav{margin-left:auto;display:flex;gap:4px}
.mast-nav button{font-size:13px;padding:6px 11px;border-radius:var(--r);
  color:var(--on-deep-dim);transition:background-color .3s var(--ease),color .3s var(--ease)}
.mast-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.mast-nav button.on{background:rgba(54,198,198,.2);color:#fff}
.mbar{height:2px;background:rgba(255,255,255,.12)}
.mbar i{display:block;height:100%;width:0;background:var(--teal);
  transition:width .6s var(--ease-out)}

.wrap{max-width:var(--wrap);margin:0 auto;padding:46px 24px 90px}
.swap{animation:swapIn .45s var(--ease-out) both}
@keyframes swapIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- type ramp ---- */
.lx-h1{font-size:clamp(30px,3.8vw,44px);font-weight:400;line-height:1.08;
  letter-spacing:-.03em;max-width:22ch;margin-bottom:16px}
.lx-h{font-size:clamp(25px,2.8vw,32px);font-weight:400;line-height:1.12;
  letter-spacing:-.025em;max-width:26ch;margin-bottom:12px}
.lx-sub{font-size:15px;font-weight:600;margin:22px 0 10px}
.lede{font-size:17px;line-height:1.55;color:var(--gray);max-width:62ch}
.lx-kick{font-size:13px;color:var(--gray);margin-bottom:10px}
h1 b,h2 b,.lx-h b,.lx-h1 b{font-weight:600}

.lx-facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin:18px 0 30px;
  font-size:13px;color:var(--gray)}
.lx-facts span{display:inline-flex;align-items:center;gap:7px}

/* ---- primitives ---- */
.ic{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 20px;border:1px solid transparent;border-radius:var(--r);
  font-size:14px;font-weight:600;
  transition:background-color .4s var(--ease),color .4s var(--ease),border-color .4s var(--ease)}
.btn-or{background:var(--or);color:var(--ink)}
.btn-or:hover{background:var(--deep);color:#fff}
.btn-line{background:transparent;color:var(--deep);border-color:var(--line)}
.btn-line:hover{border-color:var(--deep)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.note{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;
  padding:14px 18px;max-width:72ch;border:1px solid rgba(15,49,51,.14);
  border-radius:var(--r);background:var(--tint);font-size:14px;color:var(--gray);
  margin:18px 0}
.note .ic{color:var(--or);margin-top:2px}
.note b{color:var(--ink);font-weight:600}

/* ---- home ---- */
.hero{padding:10px 0 34px;border-bottom:1px solid var(--line);margin-bottom:34px}
.obj{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));
  gap:16px;margin-top:22px}
.obj div{border-left:2px solid var(--teal);padding-left:14px}
.obj b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.obj span{font-size:14px;color:var(--gray);line-height:1.5}

.mods{border-top:1px solid var(--line);margin-top:14px}
.mod{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:18px;
  align-items:center;width:100%;padding:20px 6px;border-bottom:1px solid var(--line);
  transition:background-color .3s var(--ease)}
.mod:hover{background:var(--card)}
.mod-n{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gray)}
.mod.done .mod-n{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink)}
.mod-t{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em}
.mod-s{display:block;font-size:14px;color:var(--gray);margin-top:2px}
.mod-m{font-size:13px;color:var(--gray);white-space:nowrap}

/* ---- lesson player ---- */
.step-top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.pips{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.pip{width:22px;height:4px;border-radius:2px;background:var(--line);
  transition:background-color .35s var(--ease)}
.pip.on{background:var(--teal)}
.pip.seen{background:#B9C6C6}
.step-c{font-size:13px;color:var(--gray);white-space:nowrap}

.lx-take{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:16px;margin-top:22px}
.lx-tk{border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  padding:20px;display:flex;flex-direction:column;gap:8px}
.lx-tk .k{font-size:13px;color:var(--teal-ink);font-weight:600}
.lx-tk h3{font-size:16px;font-weight:600;line-height:1.3}
.lx-tk p{font-size:14px;color:var(--gray);line-height:1.5}

.blk{margin-top:18px;max-width:72ch}
.blk p{font-size:16px;line-height:1.6;color:var(--ink)}
.blk ul{list-style:none}
.blk li{display:grid;grid-template-columns:17px minmax(0,1fr);gap:11px;
  margin-bottom:9px;font-size:15.5px;line-height:1.5}
.blk li .ic{color:var(--teal-ink);margin-top:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:16px}
.two>div{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px}
.two b{display:block;font-size:15px;font-weight:600;margin-bottom:5px}
.two span{font-size:14px;color:var(--gray);line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px}
.cards>div{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:18px}
.cards .ic{color:var(--teal-ink);margin-bottom:10px}
.cards b{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.cards span{font-size:14px;color:var(--gray);line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--gray);
  padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
blockquote{border-left:2px solid var(--teal);padding:4px 0 4px 18px;font-size:17px;
  line-height:1.5;max-width:60ch}
blockquote cite{display:block;font-style:normal;font-size:13.5px;color:var(--gray);margin-top:8px}
figure img,figure svg{max-width:100%;height:auto}
figcaption{font-size:13px;color:var(--gray);margin-top:8px}

/* ---- film ---- */
.film{position:relative;width:100%;aspect-ratio:16/9;background:#000;
  border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.film iframe{width:100%;height:100%;border:0;display:block}
.tsc{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.tsc summary{padding:13px 16px;font-size:14px;font-weight:600;cursor:pointer}
.tsc div{padding:0 16px 16px;font-size:14.5px;line-height:1.6;color:var(--gray)}
.tsc p{margin-bottom:8px}

/* ---- check ---- */
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  padding:22px;margin-bottom:14px}
.q-t{font-size:17px;font-weight:600;line-height:1.35;margin-bottom:16px}
.opt{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;width:100%;
  padding:13px 14px;border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:8px;font-size:15px;line-height:1.45;
  transition:border-color .3s var(--ease),background-color .3s var(--ease)}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt i{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-style:normal;
  font-size:12px;color:var(--gray);margin-top:1px}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.right i{background:var(--teal);border-color:var(--teal);color:#06282A}
.opt.wrong{border-color:var(--coral);background:rgba(248,94,72,.08)}
.opt.wrong i{background:var(--coral);border-color:var(--coral);color:#fff}
.why{display:grid;grid-template-columns:17px minmax(0,1fr);gap:11px;
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  font-size:14.5px;line-height:1.55;color:var(--gray)}
.why .ic{color:var(--teal-ink);margin-top:3px}
.score{text-align:center;padding:30px 0 10px}
.score .n{font-size:46px;font-weight:400;letter-spacing:-.03em}

/* ---- glossary ---- */
.gfil{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 24px}
.gfil button{font-size:13.5px;padding:7px 14px;border:1px solid var(--line);
  border-radius:999px;color:var(--gray);transition:border-color .3s,color .3s,background-color .3s}
.gfil button.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink)}
.gsearch{width:100%;max-width:340px;height:44px;padding:0 14px;font-size:15px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  font-family:inherit;color:var(--ink)}
.gsearch:focus{outline:none;border-color:var(--teal)}
.gterm{padding:16px 0;border-bottom:1px solid var(--line)}
.gterm b{font-size:16px;font-weight:600}
.gterm em{font-style:normal;font-size:12.5px;color:var(--teal-ink);margin-left:10px}
.gterm p{font-size:14.5px;color:var(--gray);line-height:1.55;margin-top:4px;max-width:70ch}

/* ---- role picker ---- */
.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));
  gap:10px;margin-top:20px}
.rolegrid button{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  font-size:15px;transition:border-color .3s var(--ease)}
.rolegrid button:hover{border-color:var(--teal)}
.rolegrid button.on{border-color:var(--teal);background:var(--teal-soft)}

/* ---- closing band ---- */
.band{background:var(--deep);color:#fff;margin-top:60px}
.band-in{max-width:var(--wrap);margin:0 auto;padding:40px 24px}
.band h2{font-size:26px;font-weight:400;letter-spacing:-.02em;margin-bottom:10px}
.band p{color:var(--on-deep-dim);font-size:15px;max-width:60ch}
.foot{max-width:var(--wrap);margin:0 auto;padding:18px 24px 40px;
  font-size:12.5px;color:var(--gray);display:flex;gap:16px;flex-wrap:wrap}

@media (max-width:760px){
  .wrap{padding:30px 18px 70px}
  .mast-in{padding:0 18px;gap:10px}
  .mast-s{display:none}
  .mod{grid-template-columns:38px minmax(0,1fr);gap:12px}
  .mod-m{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header class="mast">
  <div class="mast-in">
    <span class="mast-id"><span class="mast-t" id="mTitle"></span>
      <span class="mast-s" id="mSub"></span></span>
    <nav class="mast-nav" id="mNav"></nav>
  </div>
  <div class="mbar"><i id="mBar"></i></div>
</header>

<main id="view"></main>

<!-- In development this loads the course next to the file. build_course.py
     inlines it so the deliverable is one document. -->
<script src="course.js"></script>
<script>
/* ===========================================================================
   The engine. It renders window.COURSE and knows nothing about any subject.
   If you are about to write a sentence of course copy in this file, it
   belongs in course.js instead.
   =========================================================================== */

var C = window.COURSE;

var ICONS = {
  play:'<path d="M5 3l14 9-14 9z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  "circle-check":'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  layers:'<path d="M12.8 2.2a2 2 0 0 0-1.7 0L2.6 6.1a1 1 0 0 0 0 1.8l8.6 3.9a2 2 0 0 0 1.7 0l8.5-3.9a1 1 0 0 0 0-1.8z"/><path d="M2 12a1 1 0 0 0 .6.9l8.6 3.9a2 2 0 0 0 1.6 0l8.6-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .6.9l8.6 3.9a2 2 0 0 0 1.6 0l8.6-3.9A1 1 0 0 0 22 17"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  "arrow-right":'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  "arrow-left":'<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
  "chevron-right":'<path d="m9 18 6-6-6-6"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  zap:'<path d="M4 14a1 1 0 0 1-.8-1.6l9.9-10.2a.5.5 0 0 1 .9.5l-1.9 6A1 1 0 0 0 13 10h7a1 1 0 0 1 .8 1.6l-9.9 10.2a.5.5 0 0 1-.9-.5l1.9-6A1 1 0 0 0 11 14z"/>'
};
function ic(n){
  return '<span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" ' +
    'viewBox="0 0 24 24">' + (ICONS[n] || ICONS.check) + "</svg></span>";
}
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
/* Headings and ledes allow one tag, <b>, for emphasis. Everything else is
   escaped. Course copy is written by us, not by a user, but a course is
   copied between files often enough that escaping by default is cheaper than
   finding out later. */
function rich(s){ return esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>"); }
function $(s){ return document.querySelector(s); }

/* ------------------------------------------------------------ progress --- */
var KEY = "course:" + (C.meta.storageKey || "default");
var P = { step:{}, done:[], answers:{}, role:null, name:null };
try { P = Object.assign(P, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){}
  LMS.push();
  paintBar();
}
function stepsOf(id){ return (C.steps && C.steps[id]) || []; }
function isDone(id){ return P.done.indexOf(id) >= 0; }
function markDone(id){
  if (!isDone(id)) P.done.push(id);
  save();
}
function pct(){
  return C.modules.length ? Math.round(P.done.length / C.modules.length * 100) : 0;
}
function paintBar(){ $("#mBar").style.width = pct() + "%"; }

/* --------------------------------------------------------------- SCORM ---
   Inactive outside an LMS. The same file works from a shared link and from
   inside a course player, which is the whole reason the bridge is written
   this way rather than as a separate build. */
var LMS = (function(){
  var api = null, kind = null;
  function find(w, n){
    for (var i = 0; w && i < 8; i++){
      if (w.API_1484_11) return { a:w.API_1484_11, k:2004 };
      if (w.API)         return { a:w.API,         k:1.2 };
      w = w.parent === w ? null : w.parent;
    }
    return null;
  }
  return {
    init:function(){
      if (!C.meta.scorm) return;
      var f = find(window);
      if (!f) return;
      api = f.a; kind = f.k;
      try { kind === 2004 ? api.Initialize("") : api.LMSInitialize(""); } catch(e){ api = null; }
    },
    push:function(){
      if (!api) return;
      var done = P.done.length === C.modules.length;
      try {
        if (kind === 2004){
          api.SetValue("cmi.completion_status", done ? "completed" : "incomplete");
          api.SetValue("cmi.progress_measure", String(pct() / 100));
          api.Commit("");
        } else {
          api.LMSSetValue("cmi.core.lesson_status", done ? "completed" : "incomplete");
          api.LMSCommit("");
        }
      } catch(e){}
    },
    score:function(p){
      if (!api) return;
      try {
        if (kind === 2004){ api.SetValue("cmi.score.scaled", String(p/100)); api.Commit(""); }
        else { api.LMSSetValue("cmi.core.score.raw", String(p)); api.LMSCommit(""); }
      } catch(e){}
    }
  };
})();

/* --------------------------------------------------------------- router --- */
var V = { name:"home", mod:null, step:0 };

function go(name, mod, step){
  V = { name:name, mod:mod || null, step:step || 0 };
  pauseFilm();
  window.scrollTo(0, 0);
  render();
}

function render(){
  document.title = C.meta.title;
  $("#mTitle").textContent = C.meta.title;
  $("#mSub").textContent = C.meta.sub || "";
  $("#mNav").innerHTML =
    nav("home", "Home") +
    (C.glossary && C.glossary.length ? nav("gloss", "Glossary") : "") +
    (C.quiz && C.quiz.final ? nav("final", "Final check") : "");
  var h = V.name === "mod"   ? viewMod()
        : V.name === "gloss" ? viewGloss()
        : V.name === "final" ? viewFinal()
        : viewHome();
  $("#view").innerHTML = '<div class="swap">' + h + "</div>";
  paintBar();
  afterPaint();
}
function nav(n, label){
  return '<button data-nav="' + n + '"' + (V.name === n ? ' class="on"' : "") +
    ">" + esc(label) + "</button>";
}

/* ----------------------------------------------------------------- home --- */
function viewHome(){
  var next = C.modules.filter(function(m){ return !isDone(m.id); })[0];
  return '<div class="wrap">' +
    '<section class="hero">' +
      '<h1 class="lx-h1">' + rich(C.meta.title) + "</h1>" +
      '<p class="lede">' + rich(C.meta.sub || "") + "</p>" +
      (C.objectives && C.objectives.length
        ? '<h2 class="lx-sub">By the end of this course, you can</h2><div class="obj">' +
          C.objectives.map(function(o){
            return "<div><b>" + esc(o[0]) + "</b><span>" + esc(o[1]) + "</span></div>";
          }).join("") + "</div>"
        : "") +
      '<div class="btn-row">' +
        (next
          ? '<button class="btn btn-or" data-mod="' + next.id + '">' +
            (P.done.length ? "Continue" : "Start") + ": " + esc(next.title) +
            ic("arrow-right") + "</button>"
          : '<button class="btn btn-or" data-nav="final">Take the final check' +
            ic("arrow-right") + "</button>") +
        (C.glossary && C.glossary.length
          ? '<button class="btn btn-line" data-nav="gloss">' + ic("book") + "Glossary</button>"
          : "") +
      "</div>" +
    "</section>" +

    (C.meta.roleAsk && C.roles && C.roles.length && !P.role ? rolePick() : "") +

    '<h2 class="lx-sub">Modules</h2>' +
    '<div class="mods">' + C.modules.map(function(m, i){
      return '<button class="mod' + (isDone(m.id) ? " done" : "") + '" data-mod="' + m.id + '">' +
        '<span class="mod-n">' + (isDone(m.id) ? ic("check") : m.n || (i+1)) + "</span>" +
        '<span><span class="mod-t">' + esc(m.title) + "</span>" +
          '<span class="mod-s">' + esc(m.sub || "") + "</span></span>" +
        '<span class="mod-m">' + esc(m.time || "") + "</span></button>";
    }).join("") + "</div>" +

    '<p class="lx-kick" style="margin-top:22px">' + P.done.length + " of " +
      C.modules.length + " modules complete</p>" +
  "</div>" + band() + foot();
}

function rolePick(){
  return '<section class="card" style="padding:24px;margin-bottom:34px">' +
    '<h2 class="lx-sub" style="margin-top:0">Which role is closest to yours?</h2>' +
    '<p class="lede" style="font-size:15px">We use this to highlight the parts that ' +
      "apply to you. You can change it later, and the course works the same either way.</p>" +
    '<div class="rolegrid">' +
      C.roles.map(function(r){
        return '<button data-role="' + esc(r.id) + '">' + esc(r.t) + "</button>";
      }).join("") +
      '<button data-role="none">My role is not listed</button>' +
    "</div></section>";
}

/* --------------------------------------------------------------- module --- */
function viewMod(){
  var m = C.modules.filter(function(x){ return x.id === V.mod; })[0];
  var steps = stepsOf(m.id);
  var s = steps[V.step] || {};
  var body = s.kind === "intro" ? sIntro(m, s)
           : s.kind === "take"  ? sTake(m, s)
           : s.kind === "film"  ? sFilm(m, s)
           : s.kind === "check" ? sCheck(m)
           : s.kind === "recap" ? sRecap(m)
           : sTopic(m, s);

  return '<div class="wrap">' +
    '<div class="step-top">' +
      '<button class="btn btn-line" style="min-height:38px;padding:0 13px" data-nav="home">' +
        ic("arrow-left") + "All modules</button>" +
      '<div class="pips">' + steps.map(function(_, i){
        return '<span class="pip' + (i === V.step ? " on" : i < V.step ? " seen" : "") + '"></span>';
      }).join("") + "</div>" +
      '<span class="step-c">' + (V.step + 1) + " of " + steps.length + "</span>" +
    "</div>" +
    '<div class="swap" id="stepBody">' + body + "</div>" +
    stepNav(m, steps) +
  "</div>" + foot();
}

function stepNav(m, steps){
  var last = V.step >= steps.length - 1;
  var nextMod = C.modules[C.modules.indexOf(m) + 1];
  return '<div class="btn-row">' +
    (last
      ? (nextMod
          ? '<button class="btn btn-or" data-mod="' + nextMod.id + '">Next module: ' +
            esc(nextMod.title) + ic("arrow-right") + "</button>"
          : '<button class="btn btn-or" data-nav="' +
            (C.quiz && C.quiz.final ? "final" : "home") + '">' +
            (C.quiz && C.quiz.final ? "Final check" : "Back to modules") +
            ic("arrow-right") + "</button>")
      : '<button class="btn btn-or" data-step="' + (V.step + 1) + '">Continue' +
        ic("arrow-right") + "</button>") +
    (V.step > 0
      ? '<button class="btn btn-line" data-step="' + (V.step - 1) + '">' +
        ic("arrow-left") + "Back</button>"
      : "") +
  "</div>";
}

function sIntro(m, s){
  return '<p class="lx-kick">Module ' + (m.n || "") + " of " + C.modules.length +
      (m.time ? " · " + esc(m.time) : "") + "</p>" +
    '<h1 class="lx-h1">' + rich(s.h || m.title) + "</h1>" +
    (s.lede ? '<p class="lede">' + rich(s.lede) + "</p>" : "") +
    (s.facts ? '<div class="lx-facts">' + s.facts.map(function(f){
        return "<span>" + ic(f[0]) + esc(f[1]) + "</span>";
      }).join("") + "</div>" : "") +
    (s.goals ? '<h3 class="lx-sub">By the end of this module, you can</h3>' +
      '<div class="blk"><ul>' + s.goals.map(function(g){
        return "<li>" + ic("check") + "<span>" + esc(g) + "</span></li>";
      }).join("") + "</ul></div>" : "");
}

function takeItems(m){
  var t = stepsOf(m.id).filter(function(x){ return x.kind === "take"; })[0];
  return (t && t.items) || [];
}

function sTake(m, s){
  return '<p class="lx-kick">Before you start</p>' +
    '<h2 class="lx-h">Three things to <b>take away</b></h2>' +
    '<p class="lede">Keep these in mind as you work through the module. ' +
      "We come back to them at the end.</p>" +
    '<div class="lx-take">' + (s.items || []).map(function(x, i){
      return '<div class="lx-tk"><span class="k num">0' + (i+1) + "</span>" +
        "<h3>" + esc(x[0]) + "</h3><p>" + esc(x[1]) + "</p></div>";
    }).join("") + "</div>";
}

function sRecap(m){
  return '<p class="lx-kick">Module complete</p>' +
    '<h2 class="lx-h">What to <b>carry forward</b></h2>' +
    '<div class="lx-take">' + takeItems(m).map(function(x, i){
      return '<div class="lx-tk"><span class="k num">0' + (i+1) + "</span>" +
        "<h3>" + esc(x[0]) + "</h3><p>" + esc(x[1]) + "</p></div>";
    }).join("") + "</div>";
}

function sFilm(m, s){
  var f = (C.films || {})[s.film] || {};
  return '<p class="lx-kick">The film' + (f.len ? " · " + esc(f.len) : "") + "</p>" +
    '<h2 class="lx-h">' + rich(f.name || "Watch this first") + "</h2>" +
    '<div class="film"><iframe id="filmFrame" title="' + esc(f.name || "Film") +
      '" allowfullscreen src="' + esc((f.file || "") + (f.file && f.file.indexOf("?") >= 0 ? "&" : "?") + "embed=1") +
      '"></iframe></div>' +
    (s.transcript && s.transcript.length
      ? '<details class="tsc"><summary>Transcript</summary><div>' +
        s.transcript.map(function(l){ return "<p>" + esc(l) + "</p>"; }).join("") +
        "</div></details>"
      : '<div class="note">' + ic("info") +
        "<span><b>No transcript supplied.</b> Every film needs one before this " +
        "course ships. It is the accessible version of the film.</span></div>");
}

function sTopic(m, s){
  return (s.kick ? '<p class="lx-kick">' + esc(s.kick) + "</p>" : "") +
    '<h2 class="lx-h">' + rich(s.h || "") + "</h2>" +
    (s.lede ? '<p class="lede">' + rich(s.lede) + "</p>" : "") +
    (s.body || []).map(block).join("");
}

/* One function per block kind. Anything not listed here is not part of the
   format: add a kind rather than special-casing a module. */
function block(b){
  if (b.p)     return '<div class="blk"><p>' + rich(b.p) + "</p></div>";
  if (b.list)  return '<div class="blk"><ul>' + b.list.map(function(x){
      return "<li>" + ic(b.icon || "check") + "<span>" + rich(x) + "</span></li>";
    }).join("") + "</ul></div>";
  if (b.two)   return '<div class="blk two">' + b.two.map(function(x){
      return "<div><b>" + esc(x.t) + "</b><span>" + esc(x.d) + "</span></div>";
    }).join("") + "</div>";
  if (b.cards) return '<div class="blk cards">' + b.cards.map(function(x){
      return "<div>" + (x.icon ? ic(x.icon) : "") + "<b>" + esc(x.t) + "</b>" +
        "<span>" + esc(x.d) + "</span></div>";
    }).join("") + "</div>";
  if (b.table) return '<div class="blk"><table><thead><tr>' +
      b.table.head.map(function(h){ return "<th>" + esc(h) + "</th>"; }).join("") +
      "</tr></thead><tbody>" + b.table.rows.map(function(r){
        return "<tr>" + r.map(function(c){ return "<td>" + rich(c) + "</td>"; }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
  if (b.note)  return '<div class="note">' + ic("info") + "<span>" + rich(b.note) + "</span></div>";
  if (b.quote) return '<div class="blk"><blockquote>' + esc(b.quote) +
      (b.by ? "<cite>" + esc(b.by) + "</cite>" : "") + "</blockquote></div>";
  if (b.fig)   return '<div class="blk"><figure>' + b.fig +
      (b.cap ? "<figcaption>" + esc(b.cap) + "</figcaption>" : "") + "</figure></div>";
  return "";
}

/* ---------------------------------------------------------------- check --- */
function sCheck(m){ return quizBlock(m.id, (C.quiz || {})[m.id] || [], m); }
function viewFinal(){
  return '<div class="wrap">' +
    '<p class="lx-kick">Final check</p>' +
    '<h1 class="lx-h1">Everything, <b>once through</b></h1>' +
    quizBlock("final", (C.quiz || {}).final || [], null) +
    '<div class="btn-row"><button class="btn btn-line" data-nav="home">' +
      ic("arrow-left") + "Back to modules</button></div>" +
  "</div>" + foot();
}

function quizBlock(key, qs, m){
  if (!qs.length) return '<div class="note">' + ic("info") +
    "<span>No questions written for this check yet.</span></div>";
  var given = P.answers[key] || [];
  return qs.map(function(q, i){
    var a = given[i];
    var answered = a !== undefined && a !== null;
    return '<div class="q"><div class="q-t">' + (i+1) + ". " + rich(q[0]) + "</div>" +
      q[1].map(function(opt, k){
        var cls = !answered ? "" : k === q[2] ? " right" : k === a ? " wrong" : "";
        return '<button class="opt' + cls + '" data-q="' + key + '" data-qi="' + i +
          '" data-oi="' + k + '"' + (answered ? " disabled" : "") + ">" +
          "<i>" + "ABCD".charAt(k) + "</i><span>" + esc(opt) + "</span></button>";
      }).join("") +
      (answered ? '<div class="why">' + ic("circle-check") + "<span>" + esc(q[3] || "") +
        "</span></div>" : "") +
    "</div>";
  }).join("") + scoreLine(key, qs, m);
}

function scoreLine(key, qs, m){
  var given = P.answers[key] || [];
  var done = qs.every(function(_, i){ return given[i] !== undefined && given[i] !== null; });
  if (!done) return "";
  var right = qs.filter(function(q, i){ return given[i] === q[2]; }).length;
  var p = Math.round(right / qs.length * 100);
  LMS.score(p);
  return '<div class="score"><div class="n num">' + right + " / " + qs.length + "</div>" +
    '<p class="lede" style="margin:6px auto 0">' +
      (p === 100 ? "All correct." : p >= 60 ? "Worth re-reading the ones you missed."
        : "Worth going back through the module.") +
    '</p><div class="btn-row" style="justify-content:center">' +
      '<button class="btn btn-line" data-retry="' + key + '">Try again</button></div></div>';
}

/* ------------------------------------------------------------- glossary --- */
var gCat = "All", gQ = "";
function viewGloss(){
  var cats = ["All"];
  C.glossary.forEach(function(g){ if (cats.indexOf(g[1]) < 0) cats.push(g[1]); });
  var rows = C.glossary.filter(function(g){
    var okc = gCat === "All" || g[1] === gCat;
    var okq = !gQ || (g[0] + " " + g[2]).toLowerCase().indexOf(gQ.toLowerCase()) >= 0;
    return okc && okq;
  });
  return '<div class="wrap">' +
    '<p class="lx-kick">' + C.glossary.length + " terms</p>" +
    '<h1 class="lx-h1">Glossary</h1>' +
    '<input class="gsearch" id="gq" placeholder="Search terms" value="' + esc(gQ) + '">' +
    '<div class="gfil">' + cats.map(function(c){
      return '<button data-cat="' + esc(c) + '"' + (c === gCat ? ' class="on"' : "") + ">" +
        esc(c) + "</button>";
    }).join("") + "</div>" +
    (rows.length ? rows.map(function(g){
      return '<div class="gterm"><b>' + esc(g[0]) + "</b><em>" + esc(g[1]) + "</em>" +
        "<p>" + esc(g[2]) + "</p></div>";
    }).join("") : '<p class="lede">Nothing matches that.</p>') +
  "</div>" + foot();
}

/* ------------------------------------------------------------- chrome ----- */
function band(){
  return '<section class="band"><div class="band-in">' +
    "<h2>" + rich(C.meta.closeTitle || "That is the course") + "</h2>" +
    "<p>" + esc(C.meta.closeText || "Work through the modules in order. Your place is saved in this browser.") + "</p>" +
  "</div></section>";
}
function foot(){
  return '<div class="foot"><span>' + esc(C.meta.footer || "") + "</span>" +
    "<span>" + esc(C.meta.author || "") + "</span></div>";
}

/* ------------------------------------------------------------- the film --- */
function pauseFilm(){
  var f = document.getElementById("filmFrame");
  if (f && f.contentWindow){
    try { f.contentWindow.postMessage({ type:"film", cmd:"pause" }, "*"); } catch(e){}
  }
}
/* A film reports its own end, so the learner does not have to remember to
   confirm it. Messages from the frame are treated as a notification, never
   as instructions: the only thing acted on is the state field. */
window.addEventListener("message", function(e){
  var d = e.data;
  if (!d || d.type !== "film") return;
  if (d.state === "ended" && V.name === "mod"){
    var steps = stepsOf(V.mod);
    if (steps[V.step] && steps[V.step].kind === "film") advance();
  }
});

/* --------------------------------------------------------------- events --- */
function advance(){
  var steps = stepsOf(V.mod);
  if (V.step < steps.length - 1){
    V.step++;
    P.step[V.mod] = Math.max(P.step[V.mod] || 0, V.step);
    if (steps[V.step].kind === "recap") markDone(V.mod);
    save();
    render();
  }
}

document.addEventListener("click", function(e){
  var t = e.target;
  if (!t || !t.closest) return;

  var n = t.closest("[data-nav]");
  if (n){ go(n.getAttribute("data-nav")); return; }

  var m = t.closest("[data-mod]");
  if (m){
    var id = m.getAttribute("data-mod");
    go("mod", id, Math.min(P.step[id] || 0, stepsOf(id).length - 1));
    return;
  }

  var s = t.closest("[data-step]");
  if (s){
    var i = parseInt(s.getAttribute("data-step"), 10);
    pauseFilm();
    V.step = i;
    P.step[V.mod] = Math.max(P.step[V.mod] || 0, i);
    var st = stepsOf(V.mod)[i];
    if (st && st.kind === "recap") markDone(V.mod);
    save();
    window.scrollTo(0, 0);
    render();
    return;
  }

  var o = t.closest("[data-q]");
  if (o && !o.disabled){
    var key = o.getAttribute("data-q");
    var qi = parseInt(o.getAttribute("data-qi"), 10);
    P.answers[key] = P.answers[key] || [];
    P.answers[key][qi] = parseInt(o.getAttribute("data-oi"), 10);
    save();
    render();
    return;
  }

  var r = t.closest("[data-retry]");
  if (r){ P.answers[r.getAttribute("data-retry")] = []; save(); render(); return; }

  var c = t.closest("[data-cat]");
  if (c){ gCat = c.getAttribute("data-cat"); render(); return; }

  var ro = t.closest("[data-role]");
  if (ro){
    var v = ro.getAttribute("data-role");
    P.role = v === "none" ? "none" : v;
    save();
    render();
    return;
  }
});

document.addEventListener("input", function(e){
  if (e.target && e.target.id === "gq"){
    gQ = e.target.value;
    var pos = e.target.selectionStart;
    render();
    var el = document.getElementById("gq");
    if (el){ el.focus(); el.setSelectionRange(pos, pos); }
  }
});

document.addEventListener("keydown", function(e){
  if (V.name !== "mod") return;
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") advance();
  if (e.key === "ArrowLeft" && V.step > 0){ V.step--; render(); }
});

function afterPaint(){
  var f = document.getElementById("filmFrame");
  if (f) f.setAttribute("allow", "autoplay; fullscreen");
}

/* ----------------------------------------------------------------- boot --- */
LMS.init();
render();
</script>
</body>
</html>
