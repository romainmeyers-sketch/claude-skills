# example-proposal-copy.yaml
# Copy this file and rename it: <client-name>-proposal-copy.yaml
# Edit all values below. Never edit the build script for copy changes — edit here.
# Note: this .yaml file is not installed by Tessl (only .py and .md are distributed).
#       Copy it manually from the repo when starting a new proposal.

cover:
  eyebrow: "Metis Strategy — Prepared for [Client Name]"
  title_line_1: "Your Expanded Remit Presents"
  title_line_2: "A Significant Growth Opportunity"
  prepared_for: "Prepared for [Buyer First Last], [Title] | [Month YYYY]"

problem:
  eyebrow: "The Opportunity"
  title: "Three Converging Forces Are Reshaping [Topic]"
  pull_quote: >
    "Exact quote from the buyer's transcript that captures the core challenge.
    Use their words, not consulting language."
  numbered_items:
    - title: "First Challenge Title"
      body: >
        One to two sentences describing this challenge using language
        that mirrors what the buyer said during discovery.
    - title: "Second Challenge Title"
      body: >
        One to two sentences. Keep it concrete. Avoid "leverage" and "synergies."
    - title: "Third Challenge Title"
      body: >
        One to two sentences. End with a forward-looking signal — what this means
        for the engagement.
  metrics:
    - number: "$XXB+"
      label: "Combined P&L under scope"
    - number: "Dozens"
      label: "Unique partnerships to coordinate"
    - number: "Ongoing"
      label: "Complexity of the operating challenge"

approach_divider:
  title: "Our Approach\nto [Client Engagement Theme]"
  subtitle: >
    Four integrated modules designed to [outcome], sequenced for
    immediate momentum and sustainable change.

modules_overview:
  eyebrow: "Engagement Structure"
  title: "Four Modules, One Integrated Operating Model"
  modules:
    - title: "Module A: [Short Name]"
      body: >
        One sentence on what this module achieves and why it matters
        as the foundation for the rest.
    - title: "Module B: [Short Name]"
      body: >
        One sentence. Keep module descriptions parallel in structure
        and length.
    - title: "Module C: [Short Name]"
      body: >
        One sentence. Avoid describing activities — describe the outcome.
    - title: "Module D: [Short Name]"
      body: >
        One sentence. The last module often sets up sustainable capability
        or ongoing operation.
  callout:
    label: "SEQUENCING"
    body: >
      Modules are designed to build on each other but can be activated
      independently based on [client]'s priorities and readiness.
      Fee estimates and sequencing options will follow in a separate communication.

module_a_divider:
  title: "Module A\n[Full Module Name]"
  subtitle: "[One-line description of what this module delivers]"

module_a:
  eyebrow: "Module A"
  title: "[Full Module A Title]"
  subtitle: >
    [One sentence describing the purpose and scope of this module's activities.]
  activities:
    - "Activity one — describe in terms of what Metis does"
    - "Activity two — keep parallel structure across all items"
    - "Activity three — 3–6 items is the right range"
    - "Activity four"
    - "Activity five"
  deliverables:
    - "Deliverable one — tangible artifact (assessment, roadmap, framework, etc.)"
    - "Deliverable two"
    - "Deliverable three"
    - "Deliverable four"
    - "Deliverable five"
  callouts:
    - label: "KEY INSIGHT"
      body: >
        One to two sentences that explain why this module is particularly
        relevant to [client]'s specific situation. Use buyer language.

# Module B, C, D follow the same structure as module_a above.
# Add module_b_divider, module_b, module_c_divider, module_c, etc.

proof_divider:
  title: "Our Proof Points"
  subtitle: "Relevant experience from comparable engagements."

# Case studies are handled in the build script with photo references.
# Add proof point data here following this pattern:
proof_ally:
  eyebrow: "Client Experience"
  title: "[Client Descriptor, e.g., 'A Top-25 US Bank']"
  big_number: "$30M+"
  big_number_label: "Annual Cost Reduction"
  context: >
    One sentence on the client's situation and what they engaged Metis to do.
  phases:
    - title: "Phase 1 Title"
      body: "One sentence on what happened and what it achieved."
    - title: "Phase 2 Title"
      body: "One sentence."
    - title: "Phase 3 Title"
      body: "One sentence."
  metrics:
    - number: "1,750"
      label: "Individuals impacted"
    - number: "8–26%"
      label: "Productivity improvement range"
    - number: "18 mo"
      label: "Time to sustained adoption"
  relevance_label: "RELEVANCE TO [CLIENT]"
  relevance_body: >
    One to two sentences connecting this proof point to the client's
    specific situation using their language from the transcript.

next_steps:
  eyebrow: "Moving Forward"
  title: "Three Steps to Begin"
  steps:
    - title: "Administrative Unlock"
      body: >
        [Client] initiates vendor registration and procurement onboarding.
        Metis will provide required documentation within 48 hours of request.
    - title: "Scoping Session"
      body: >
        A 60-minute working session with [Buyer] and relevant stakeholders
        to confirm module prioritization and define success criteria for Phase 1.
    - title: "Kickoff"
      body: >
        Module A kickoff within [X weeks] of contract execution, with a
        refined project plan and workstream owners identified on both sides.
  commitment:
    label: "OUR COMMITMENT"
    body: >
      Metis is committed to a flexible engagement structure that meets
      [Client] where they are. Fee estimates and staffing details will
      follow in a separate communication. We are ready to move at your pace.

closing:
  name: "Andrew Krusell"
  role: "Principal, Metis Strategy"
  email: "akrusell@metisstrategy.com"
