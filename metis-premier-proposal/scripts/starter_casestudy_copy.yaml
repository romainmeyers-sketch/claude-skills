# starter_casestudy_copy.yaml — Case-study template (flat sections)
#
# Single-engagement deep dive. 10-14 pages, proof-forward. One client,
# one thesis: "here's what happened; here's why it worked."
#
# Client names are anonymized per references/content-rules.md:
#   - Use industry descriptors like "a Top-25 US bank" or "a Fortune 500
#     industrial automation company"
#   - Specific financials in aggregate ($30M savings) are fine; product
#     names and division names are not
#
# Rebuild with:
#   PYTHON="C:/Users/.../python.exe"
#   "$PYTHON" starter_casestudy.py <your-copy>.yaml

doc_label: "[Case Study Short Name]"
output_file: "[Case-Study-Name]_Case-Study_Metis-Strategy.pdf"

sections:
  # ─── COVER ────────────────────────────────────────────────────────
  - type: cover
    eyebrow: "Metis Strategy Case Study"
    title_line_1: "[Headline outcome or challenge]"
    title_line_2: "[Secondary line]"
    tagline: "[Industry descriptor — e.g., Fortune 500 Industrial Automation]"
    photo: "G:/Shared drives/Knowledge Management/New Brand Assets/PPT Assets/Metis PPT Images/pexels-pixabay-63320-bw.jpg"

  # ─── SITUATION ────────────────────────────────────────────────────
  - type: problem_framing
    intent: "Set up the client's starting context and what they had to solve"
    photo: "G:/Shared drives/Knowledge Management/New Brand Assets/PPT Assets/Metis PPT Images/pexels-divinetechygirl-1181311-bw.jpg"
    eyebrow: "The Situation"
    title: "[One-line framing of the engagement challenge]"
    pull_quote: "[Short statement of what was at stake]"
    numbered_items:
      - title: "[Pressure 1]"
        body: "One to two sentences."
      - title: "[Pressure 2]"
        body: "One to two sentences."
      - title: "[Pressure 3]"
        body: "One to two sentences."
    metrics:
      - number: "[N]"
        label: "[Scale metric 1]"
      - number: "[N]"
        label: "[Scale metric 2]"
      - number: "[N]"
        label: "[Scale metric 3]"

  # ─── APPROACH (signature visual or timeline) ──────────────────────
  - type: section_divider
    title: "Our Approach"
    subtitle: "[One line on the method applied]"
    device_path: nexus

  - type: signature_image
    intent: "Anchor the methodology with a single named framework"
    eyebrow: "The Method"
    title: "[Framework Name]"
    subtitle: "[One line describing what the framework does]"
    image: "[path/to/framework-image.png]"
    callout:
      label: "APPLICATION"
      body: "One to two sentences on how the framework was applied in this engagement."

  # ─── RESULTS ──────────────────────────────────────────────────────
  - type: section_divider
    title: "The Results"
    subtitle: "[One line quantifying what the engagement delivered]"

  - type: proof_overview
    intent: "Deliver the headline outcome with a defensible dollar number"
    photo: "G:/Shared drives/Knowledge Management/New Brand Assets/PPT Assets/Metis PPT Images/Metis_flatiron_bw2.jpg"
    eyebrow: "Engagement Overview"
    title: "[Industry Descriptor]"
    photo_big_line_1: "$XXM+"
    photo_big_line_2: "[Headline outcome]"
    photo_subtitle: "[Industry segment]"
    context: "One sentence on scope."
    phases:
      - title: "Phase 1 Title"
        body: "One sentence."
      - title: "Phase 2 Title"
        body: "One sentence."
      - title: "Phase 3 Title"
        body: "One sentence."
    metrics:
      - number: "[N]"
        label: "[Label]"
      - number: "[N]"
        label: "[Label]"
      - number: "[N]"
        label: "[Label]"
    relevance_label: "WHAT THIS DEMONSTRATES"
    relevance_body: "One to two sentences on what the proof establishes."

  # ─── SUPPORTING EVIDENCE ──────────────────────────────────────────
  - type: minicase_pair
    intent: "Break out the largest contributing workstreams with hard savings"
    eyebrow: "Proof Points | Workstreams"
    title: "[Workstream Category]"
    subtitle: "[Selected workstreams, anonymized]"
    cases:
      - badge: "[WORKSTREAM A]"
        badge_color: "DARK_NAVY"
        big_number: "$X.XM"
        number_label: "Annual savings"
        product_title: "[Workstream A Title]"
        body: "One to two sentences on scope and mechanism."
      - badge: "[WORKSTREAM B]"
        badge_color: "MED_BLUE"
        big_number: "$XXXK"
        number_label: "Annual savings"
        product_title: "[Workstream B Title]"
        body: "One to two sentences on scope and mechanism."

  # ─── WHAT GOOD LOOKS LIKE ─────────────────────────────────────────
  - type: quote
    intent: "Close with what the engagement established as the new bar"
    eyebrow: "What Good Looks Like"
    quote: "[A durable statement of what this engagement made possible — either a client voice or an observation from the work itself. One to two sentences.]"
    attribution: "[Attribution line, anonymized per content rules]"
    context: "[Optional: one line of surrounding context]"

  # ─── CLOSING ──────────────────────────────────────────────────────
  - type: closing
    thank_you: "[Credit line — acknowledge the client team, anonymized]"
    name: "[Author Name]"
    role: "[Author Role], Metis Strategy"
    email: "[email@metisstrategy.com]"
    brandline: "Driving change. Elevating leaders."
    copyright: "© 2026 Metis Strategy LLC. All rights reserved. Proprietary & Confidential."
