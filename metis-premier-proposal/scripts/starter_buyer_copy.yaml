# starter_buyer_copy.yaml — Buyer-mode proposal template (flat sections)
#
# Copy this file to your project folder and rename (e.g., citi-proposal-copy.yaml).
# Fill out the brief (scripts/_brief_template.md) first. No YAML before brief.
#
# Buyer mode conventions:
#   - cover.prepared_for: "Prepared for [Name], [Title] | [Month YYYY]"
#   - Mirror the buyer's transcript language in titles and pull quotes
#   - Include a next_steps section with 3 steps + commitment callout
#   - Industry-matched case studies (see references/content-rules.md)
#
# Rebuild with:
#   PYTHON="C:/Users/.../python.exe"
#   "$PYTHON" starter_buyer.py <your-copy>.yaml

client_name: "[Client Name]"
output_file: "[Client]-Proposal_[YYYY-MM-DD].pdf"

sections:
  # ─── COVER ────────────────────────────────────────────────────────
  - type: cover
    eyebrow: "Proposal for Collaboration"
    title_line_1: "[Headline line 1 — use buyer's language]"
    title_line_2: "[Headline line 2]"
    prepared_for: "Prepared for [Name], [Title]  |  [Month YYYY]"
    photo: "G:/Shared drives/Knowledge Management/New Brand Assets/PPT Assets/Metis PPT Images/pexels-pixabay-63320-bw.jpg"

  # ─── PROBLEM FRAMING ──────────────────────────────────────────────
  - type: problem_framing
    intent: "Name the failure modes in the buyer's own language"
    photo: "G:/Shared drives/Knowledge Management/New Brand Assets/PPT Assets/Metis PPT Images/pexels-divinetechygirl-1181311-bw.jpg"
    eyebrow: "The [Topic] Opportunity"
    title: "[Title that mirrors the buyer's phrasing]"
    pull_quote: "[Exact quote from buyer's transcript — the core challenge, in their words.]"
    numbered_items:
      - title: "[First Challenge]"
        body: "One to two sentences in buyer's language."
      - title: "[Second Challenge]"
        body: "One to two sentences."
      - title: "[Third Challenge]"
        body: "One to two sentences, ending with forward-looking signal."
    metrics:
      - number: "$XXB+"
        label: "[Metric 1 label]"
      - number: "Dozens"
        label: "[Metric 2 label]"
      - number: "Ongoing"
        label: "[Metric 3 label]"

  # ─── APPROACH DIVIDER ─────────────────────────────────────────────
  - type: section_divider
    title: "Our Approach\nto [Engagement Theme]"
    subtitle: "[One line positioning the modules as an integrated operating model.]"
    device_path: nexus

  # ─── MODULES OVERVIEW ─────────────────────────────────────────────
  - type: modules_overview
    intent: "Show the modules as a continuous thread, not a menu"
    eyebrow: "Engagement Structure"
    title: "[Module Count] Modules, One Integrated Operating Model"
    modules:
      - title: "Module A: [Short Name]"
        body: "One sentence on outcome and why it matters as foundation."
      - title: "Module B: [Short Name]"
        body: "One sentence, parallel in structure to A."
      - title: "Module C: [Short Name]"
        body: "One sentence on outcome, not activities."
      - title: "Module D: [Short Name]"
        body: "One sentence, often sets up sustainable capability."
    callout:
      label: "SEQUENCING"
      body: "Modules build on each other but can be activated independently based on [Client]'s priorities. Fee estimates and sequencing options will follow in a separate communication."

  # ─── MODULE A ─────────────────────────────────────────────────────
  - type: section_divider
    title: "Module A\n[Full Module Name]"
    subtitle: "[One line describing what this module delivers]"

  - type: activities_deliverables
    intent: "Show specifically what we own in Module A"
    eyebrow: "Module A"
    title: "[Full Module A Title]"
    subtitle: "[One sentence describing purpose and scope]"
    activities:
      - "Activity one — what Metis does"
      - "Activity two"
      - "Activity three"
      - "Activity four"
    deliverables:
      - "Deliverable one — tangible artifact"
      - "Deliverable two"
      - "Deliverable three"
      - "Deliverable four"
    callouts:
      - label: "KEY INSIGHT"
        body: "Why this module is particularly relevant to [Client]'s situation. Use buyer language."

  # Add Module B, C, D following the same pattern.
  # Each: section_divider + activities_deliverables (+ optional pillars or timeline)

  # ─── PROOF POINTS ─────────────────────────────────────────────────
  - type: section_divider
    title: "Our Proof Points"
    subtitle: "Relevant experience from comparable engagements."
    device_path: nexus

  - type: proof_overview
    intent: "Show end-to-end engagement scope with a defensible dollar number"
    photo: "G:/Shared drives/Knowledge Management/New Brand Assets/PPT Assets/Metis PPT Images/Metis_flatiron_bw2.jpg"
    eyebrow: "Client Experience"
    title: "[Anonymized Client Descriptor, e.g., 'A Top-25 US Bank']"
    photo_big_line_1: "$XXM+"
    photo_big_line_2: "[Headline outcome]"
    photo_subtitle: "[Industry descriptor]"
    context: "One sentence on the client situation and what they engaged Metis to do."
    phases:
      - title: "Phase 1 Title"
        body: "One sentence on what happened and what it achieved."
      - title: "Phase 2 Title"
        body: "One sentence."
      - title: "Phase 3 Title"
        body: "One sentence."
    metrics:
      - number: "1,750"
        label: "Individuals impacted"
      - number: "8–26%"
        label: "Productivity range"
      - number: "18 mo"
        label: "Time to adoption"
    relevance_label: "RELEVANCE TO [CLIENT]"
    relevance_body: "One to two sentences connecting this proof to [Client]'s situation in their own language."

  # ─── NEXT STEPS ───────────────────────────────────────────────────
  - type: next_steps
    eyebrow: "Moving Forward"
    title: "Three Steps to Begin"
    steps:
      - title: "Administrative Unlock"
        body: "[Client] initiates vendor registration and procurement onboarding. Metis provides required documentation within 48 hours of request."
      - title: "Scoping Session"
        body: "A 60-minute working session with [Buyer] and relevant stakeholders to confirm module prioritization and define success criteria for Phase 1."
      - title: "Kickoff"
        body: "Module A kickoff within [X weeks] of contract execution, with a refined project plan and workstream owners identified on both sides."
    commitment:
      label: "OUR COMMITMENT"
      body: "Metis is committed to a flexible engagement structure that meets [Client] where they are. Fee estimates and staffing details will follow in a separate communication."

  # ─── CLOSING ──────────────────────────────────────────────────────
  - type: closing
    name: "Andrew Krusell"
    role: "Principal, Metis Strategy"
    email: "akrusell@metisstrategy.com"
